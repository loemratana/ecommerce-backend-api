spring:
  application:
    name: ecommerce-api
  config:

    import: optional:file:.env[.properties]
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST}:${SPRING_DATASOURCE_PORT}/${SPRING_DATASOURCE_DATABASE}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        highlight_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  # SMTP for notification emails. Empty SMTP_HOST = email is off (the EMAIL channel reports "not configured")
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: ${JWT_SECRET:w9zDBHed0L3XnCsVy8IX8ssl80tMvn2y+EIgpAtozj8=}
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:9000}
  refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:dvuezb9cx}
  api_key: ${CLOUDINARY_API_KEY:329418549169563}
  api_secret: ${CLOUDINARY_API_SECRET:gobe75I-myO9avg0szjR4hd_FoU}



# The app.order.*, app.invoice.*, app.localization.* and jwt.access-token-ttl-seconds values
# below are only starting values: they fill the store_settings row the first time the app runs,
# after which admins change them in the dashboard (Settings).
app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    # true = add 100 sample fashion products (CatalogProductSeeder); existing slugs are skipped
    catalog-products: ${APP_SEED_CATALOG_PRODUCTS:false}
  order:
    tax-rate: ${APP_ORDER_TAX_RATE:0.00}          # 0.10 = 10% on (subtotal - discount)
    shipping-fee: ${APP_ORDER_SHIPPING_FEE:0.00}
    pending-timeout: ${APP_ORDER_PENDING_TIMEOUT:PT30M}         # unpaid orders are cancelled after this, freeing their stock
    expiry-check-interval: ${APP_ORDER_EXPIRY_CHECK_INTERVAL:PT1M}
    return-window: ${APP_ORDER_RETURN_WINDOW:P30D}               # customers can request a return this long after delivery
  invoice:                                                        # seller details printed on invoice PDFs
    company-name: ${APP_INVOICE_COMPANY_NAME:E-Commerce Store}
    company-address: ${APP_INVOICE_COMPANY_ADDRESS:}
    company-email: ${APP_INVOICE_COMPANY_EMAIL:}
    currency: ${APP_INVOICE_CURRENCY:USD}
  localization:
    timezone: ${APP_TIMEZONE:Asia/Phnom_Penh}
  inventory:
    low-stock-threshold: ${LOW_STOCK_THRESHOLD:10}               # available stock at or below this is "low" (badge, stats, alert)
  minio:
    url: ${MINIO_URL}
    access:
      name: ${MINIO_ACCESS_KEY}
      secret: ${MINIO_SECRET_KEY}

  stripe:
    # Empty = Stripe is off: the gateway isn't created and checkout only offers the other methods
    secret-key: ${STRIPE_SECRET_KEY:}
    # Customers come back here after paying: /checkout/success and /checkout/cancel
    storefront-url: ${STOREFRONT_URL:http://localhost:3000}

  aba-payway:
    # Empty merchant-id or public-key = ABA PayWay is off: the gateway isn't created
    merchant-id: ${ABA_PAYWAY_MERCHANT_ID:}
    # PayWay's API key ("public key"); every request is signed with HMAC-SHA512 using it
    public-key: ${ABA_PAYWAY_PUBLIC_KEY:}
    # Not used yet: PayWay's refund API needs ABA's RSA keys, so refunds are made in the merchant portal
    secret-key: ${ABA_PAYWAY_SECRET_KEY:}
    # Sandbox; production is https://checkout.payway.com.kh
    base-url: ${ABA_PAYWAY_BASE_URL:https://checkout-sandbox.payway.com.kh}
    # Optional. Public URL of OUR callback, e.g. https://<your-domain>/api/v1/payments/aba-payway/callback.
    # PayWay posts there after a payment, so the order is paid even if the customer closes the tab.
    callback-url: ${ABA_PAYWAY_CALLBACK_URL:}
    # Customers come back here after paying: /checkout/success and /checkout/cancel
    storefront-url: ${STOREFRONT_URL:http://localhost:3000}
    # PayWay payment_option: empty = PayWay shows every method enabled on the profile;
    # or one of cards, abapay_khqr, abapay_khqr_deeplink, alipay, wechat, google_pay
    payment-option: ${ABA_PAYWAY_PAYMENT_OPTION:}

  # Store notifications (new order, low stock, new product). WHERE they go - Telegram groups and email
  # addresses per event - is managed by admins: Settings -> notification destinations. Only credentials live here.
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:true}
    # From @BotFather. Empty = Telegram is off. One bot serves every group: add it to each group.
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
    # Sender address for notification emails; must be allowed by the SMTP server
    email-from: ${EMAIL_FROM:}
    # Starting value only: admins switch the customer order-confirmation email in Settings -> Notifications
    customer-order-email: ${CUSTOMER_ORDER_EMAIL:true}

server:
  port: 8083
  address: 0.0.0.0
  # Behind a proxy (e.g. a Cloudflare tunnel) use its X-Forwarded-Proto/Host, so generated URLs
  # such as Swagger's server url are https instead of http
  forward-headers-strategy: framework
logging:
  level:
    root: INFO                                # General logging level for the application
    org.springframework.data.jpa.repository: DEBUG  # Log JPA repository method calls
#    org.hibernate.SQL: DEBUG                   # Log SQL statements executed by Hibernate
    org.hibernate.type.descriptor.sql: TRACE   # Log SQL parameter binding

springdoc:
  api-docs:
    version: openapi_3_0   # springdoc 3.x defaults to 3.1, which fails to clone validated numeric param schemas\
  swagger-ui:
    path: /swagger-ui.html
    filter: true
    tags-sorter: alpha


