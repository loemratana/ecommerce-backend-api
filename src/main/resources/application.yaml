spring:
  application:
    name: ecommerce-api
  datasource:
    username: admin-ecommerce
    password: ecommerce!120@897
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/ecommerce}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        highlight_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

