<!DOCTYPE html>
<!--
  Shared frame of every notification email. Styles are inline because many email clients drop
  <style> blocks. Variables: title (subject), storeName; customerFacing (+ storeEmail, storePhone)
  switches the footer from the admin note to the store's contact details. heading and content are passed in.
-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(heading, content)" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">Notification</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;border:1px solid #e5e7eb;">
                <tr>
                    <td style="background:#111827;color:#ffffff;padding:16px 24px;font-size:16px;font-weight:bold;border-radius:8px 8px 0 0;"
                        th:text="${storeName != null ? storeName : 'E-Commerce Store'}">E-Commerce Store</td>
                </tr>
                <tr>
                    <td style="padding:24px;">
                        <h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;color:#111827;" th:text="${heading}">Heading</h1>
                        <div th:replace="${content}">Content</div>
                    </td>
                </tr>
                <tr th:if="${customerFacing}">
                    <td style="padding:16px 24px;font-size:12px;line-height:1.5;color:#6b7280;border-top:1px solid #e5e7eb;">
                        Questions about your order? Contact
                        <span th:text="${storeName != null ? storeName : 'us'}">us</span><span th:if="${storeEmail != null}"> at
                        <a th:href="|mailto:${storeEmail}|" th:text="${storeEmail}" style="color:#2563eb;">shop@example.com</a></span><span
                            th:if="${storePhone != null}"> or call <span th:text="${storePhone}">012 345 678</span></span>.
                    </td>
                </tr>
                <tr th:unless="${customerFacing}">
                    <td style="padding:16px 24px;font-size:12px;line-height:1.5;color:#6b7280;border-top:1px solid #e5e7eb;">
                        Automatic notification from the
                        <span th:text="${storeName != null ? storeName : 'store'}">store</span> admin system.
                        Admins choose who receives these in Settings &rarr; Notifications.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
