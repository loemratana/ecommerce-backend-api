<!DOCTYPE html>
<!-- LOW_STOCK. Variables: productTitle, sku, available, threshold, outOfStock, storeName, title. -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: layout(${outOfStock ? 'Out of stock' : 'Low stock'}, ~{::content})}" lang="en">
<body>
<div th:fragment="content">
    <p style="margin:0 0 16px;">
        <span th:style="${outOfStock}
                  ? 'display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold;background:#fee2e2;color:#991b1b;'
                  : 'display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold;background:#fef3c7;color:#92400e;'"
              th:text="${outOfStock ? 'OUT OF STOCK' : 'LOW STOCK'}">LOW STOCK</span>
    </p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;line-height:1.6;">
        <tr>
            <td style="color:#6b7280;width:130px;">Product</td>
            <td style="font-weight:bold;" th:text="${productTitle}">Basic Tee</td>
        </tr>
        <tr>
            <td style="color:#6b7280;">SKU</td>
            <td th:text="${sku}">TEE-M-BLK</td>
        </tr>
        <tr>
            <td style="color:#6b7280;">Available</td>
            <td style="font-weight:bold;" th:text="${available}">4</td>
        </tr>
        <tr>
            <td style="color:#6b7280;">Alert threshold</td>
            <td th:text="${threshold}">10</td>
        </tr>
    </table>
    <p style="margin:16px 0 0;font-size:14px;color:#374151;">Restock this variant from Inventory in the admin dashboard.</p>
</div>
</body>
</html>
